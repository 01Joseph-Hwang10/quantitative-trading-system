---
# Guarded rolling update: the same deploy steps, but part of `just update`
# (which applies the KRX market-hours guard before invoking this playbook).
- name: Update quantitative-trading stack
  hosts: vm
  become: true
  gather_facts: false

  pre_tasks:
    - name: Require image tag
      ansible.builtin.fail:
        msg: "Run with -e tag=<git-sha> (e.g. via `just update`)"
      when: tag is not defined

  tasks:
    - name: Run the deploy steps
      ansible.builtin.import_tasks: deploy_tasks.yml
