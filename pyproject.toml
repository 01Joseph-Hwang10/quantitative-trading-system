[project]
name = "quantitative-trading-system"
version = "0.1.0"
description = "Quantitative Trading System"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "authlib>=1.3.2",
    "croniter>=6.2.4",
    "google-cloud-logging>=3.16.3",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "plotly>=6",
    "pydantic-settings>=2.13.0",
    "python-dateutil>=2.9.0.post0",
    "pytrends>=4.9.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.64.0",
    "ta-lib>=0.7.1",
    "tenacity>=9.1.4",
    "tossinvest>=0.1.0",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system"]

[dependency-groups]
dev = [
    "jupyter-bokeh>=4.1.0",
    "backtesting>=0.6.6",
    "black>=26.5.1",
    "ipykernel>=7.3.0",
    "isort>=9.0.1",
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.isort]
profile = "black"

[tool.black]
line-length = 120
target-version = ["py313"]
include = "\\.pyi?$"
extend-exclude = "/(\n  # The following are specific to Black, you probably don't want those.\n  tests/data\n  | profiling\n)/\n"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
